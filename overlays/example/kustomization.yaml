apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Grafana admin credentials — copy this file to overlays/production/
# and set real values there (production/ is gitignored).
secretGenerator:
  - name: grafana-credentials
    envs:
      - grafana-credentials.env
    options:
      disableNameSuffixHash: true

# Uncomment and customise patches below for your cluster.
patches: []

# Example patches:
#
# Pin a specific StorageClass across all PVCs:
#   patches:
#     - patch: |-
#         - op: add
#           path: /spec/storageClassName
#           value: your-storage-class
#       target:
#         kind: PersistentVolumeClaim
#
# Increase Prometheus storage:
#   patches:
#     - patch: |-
#         - op: replace
#           path: /spec/resources/requests/storage
#           value: 50Gi
#       target:
#         kind: PersistentVolumeClaim
#         name: prometheus-storage
#
# Add node affinity to schedule the stack on specific nodes:
#   patches:
#     - patch: |-
#         - op: add
#           path: /spec/template/spec/nodeSelector
#           value:
#             observability: "true"
#       target:
#         kind: Deployment
