name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate manifests and config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -sSLo kustomize.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.3.0/kustomize_v5.3.0_linux_amd64.tar.gz
          tar xf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/
          kustomize version

      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/
          kubeconform -v

      - name: Build manifests
        run: kustomize build . > /tmp/manifests.yaml

      - name: Validate K8s schemas
        run: |
          kubeconform \
            -strict \
            -ignore-missing-schemas \
            -output pretty \
            /tmp/manifests.yaml

      - name: Validate Alloy config
        run: |
          python3 - <<'EOF' > /tmp/config.alloy
          import yaml, sys
          with open("logging/alloy/configmap.yaml") as f:
              cm = yaml.safe_load(f)
          config = cm.get("data", {}).get("config.alloy")
          if not config:
              sys.exit("config.alloy key not found in ConfigMap")
          print(config)
          EOF

          docker run --rm \
            -v /tmp/config.alloy:/etc/alloy/config.alloy:ro \
            grafana/alloy:v1.3.1 \
            fmt /etc/alloy/config.alloy
