version: 2
updates:
- package-ecosystem: docker
  directories:
  - "/base/**"
  schedule:
    interval: weekly
  # Supply-chain guard: only propose versions published at least 7 days ago, so
  # compromised releases have time to be caught and yanked. Security updates bypass this.
  cooldown:
    default-days: 7
  open-pull-requests-limit: 3
  groups:
    images-minor-and-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: monthly
  cooldown:
    default-days: 7
  open-pull-requests-limit: 3
  groups:
    actions-minor-and-patch:
      update-types:
      - minor
      - patch
